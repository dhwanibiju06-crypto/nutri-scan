<!DOCTYPE html>
<html lang="en">
<head>
    <title>NutriScan Capture</title>
    <link rel="stylesheet" href="styles.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>

    <h1>NutriScan Camera Access</h1>
    <p id="statusMessage">You have chosen the "Use Camera" option. Click the button to request camera permission.</p>
    
    <!-- Button triggers the permission prompt -->
    <button id="startCameraButton">Start Camera</button>

    <!-- The video element where the stream will appear -->
    <video id="videoElement" autoplay playsinline></video>
    <canvas id="canvas" width = "800" height = "550"></canvas>

    <!-- Takes pic -->
    <img id="cameraicon" src="images/cameraicon.svg" alt="cameraLogo">

    <!-- JavaScript code using 'const' -->
    <script>
        // Use const to define constant references to DOM elements
        const startButton = document.querySelector('#startCameraButton');
        const video = document.querySelector('#videoElement');
        const statusMessage = document.querySelector('#statusMessage');
        const cameraicon = document.querySelector('#cameraicon');
        const canvas = document.querySelector('#canvas');
        const context = canvas.getContext('2d');

        // Function defined using modern syntax
        const startCamera = () => {
            statusMessage.textContent = "Requesting camera access... Look for the pop-up.";
            startButton.disabled = true; 

            // This triggers the browser permission dialog
            navigator.mediaDevices.getUserMedia({ video: true, audio: false })
                .then((stream) => {
                    // Success: User allowed access
                    statusMessage.textContent = "Access granted! Camera active.";
                    statusMessage.classList.remove('error');
                    
                    video.srcObject = stream;
                    video.style.display = 'block'; // Show the video element
                    cameraicon.style.display = 'block';
                    startButton.style.display = 'none'; // Hide the start button
                })
                .catch((error) => {
                    // Error: User clicked "Block" or an issue occurred
                    console.error("Error accessing media devices:", error);
                    statusMessage.classList.add('error');

                    if (error.name === 'NotAllowedError') {
                        statusMessage.textContent = "Access denied! Refresh the page to try again.";
                    } else if (error.name === 'NotFoundError') {
                        statusMessage.textContent = "No camera found on this device.";
                    } else {
                        statusMessage.textContent = "An error occurred: " + error.name;
                    }
                    
                    startButton.disabled = false;
                });
        };

        // Attach the startCamera function to the button's click event
        startButton.addEventListener('click', startCamera);

        const takePic= () => {
            canvas.style.display='block';
            context.drawImage(video, 0, 0, canvas.width, canvas.height); // Capture frame when button is clicked
            //video.style.display = 'none';
            statusMessage.textContent = "Picture captured!";
        };
        cameraicon.addEventListener('click', takePic);

    </script>

</body>
</html>
