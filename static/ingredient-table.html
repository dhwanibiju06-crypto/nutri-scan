<!DOCTYPE html>
<html lang="en">
<head>
    <title>Ingredient Analysis</title>
    <link rel="stylesheet" href="styles.css">

</head>
<body>
    <h1>Ingredient Analysis Report</h1>
    <table id="ingredient-table">
    </table>

    <script>
        
        // Sample data for demonstration
        const ingredients = [
              {
      "category": "Grain/Flour blend",
      "classification": "allergen",
      "concerns": "Contains wheat and malted barley, which are sources of gluten and common allergens.",
      "ingredient": "Enriched unbleached flour (wheat flour, malted barley flour, ascorbic acid [dough conditioner], niacin, reduced iron, thiamin mononitrate, riboflavin, folic acid)",
      "purpose": "Provides structure and bulk to the product; enriched with vitamins and minerals to restore nutrients lost during processing and fortify the food."
    },
    {
      "category": "Sweetener",
      "classification": "caution",
      "concerns": "Excessive consumption of added sugars is linked to increased risk of weight gain, type 2 diabetes, heart disease, and dental caries. Contributes to overall caloric intake without significant nutritional value.",
      "ingredient": "sugar",
      "purpose": "Sweetener, flavor enhancer, aids in browning and provides texture."
    }
        ];

        // ToDo: Add functionality to fetch real data from backend instead of using sample data
        // Get the data and then change the createHeader and createBody.

        // Function to create and populate the ingredient table
        const createIngredientTable = () => {
            const table = document.getElementById('ingredient-table');

            // Create table header
            const header = table.createTHead();
            const headerRow = header.insertRow(0);
            const headers = ["Ingredient", "Category", "Classification", "Concerns",];
            headers.forEach((text, index) => {
                const cell = headerRow.insertCell(index);
                cell.outerHTML = `<th>${text}</th>`;
            });

            // Create table body
            const tbody = table.createTBody();
            ingredients.forEach(ingredient => {
                const row = tbody.insertRow();
                row.insertCell(0).textContent = ingredient.ingredient;
                row.insertCell(1).textContent = ingredient.category;
                row.insertCell(2).textContent = ingredient.classification;
                row.insertCell(3).textContent = ingredient.concerns;

            });
        };

        // Call the function to create the table on page load
        createIngredientTable();
    </script>
</body>
</html>
