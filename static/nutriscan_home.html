<html>
    <head>
        <link rel="stylesheet" href="/static/styles.css">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>NutriScan</title>
    </head>
    <body>
        <h1>Welcome to NutriScan</h1>

        <h2>"Always making YOUR life easier"</h2>

        <h3>Would you like to upload an image or use your camera?</h3>

        <a href="/camerapage">
            <button id = "camera">Use Camera</button>
        </a>

        <input type="file" id="fileInput" accept="image/*">
        <br><br>

        <img id="imagePreview" width="400" style="display:none;">
        <br><br>

        <button id="scanButton" style="display:none;">Start Scan</button>

        <p id="statusMessage"></p>

        <table id="ingredient-table">
        </table>

        <script>
        const fileInput = document.getElementById("fileInput");
        const image = document.getElementById("imagePreview");
        const scanButton = document.getElementById('scanButton');
        const statusMessage = document.getElementById("statusMessage");
        const table = document.getElementById('ingredient-table');
        const savedImage = localStorage.getItem('capturedImage');

        const fileInputSelect = () => {

            const file = fileInput.files[0];
            if (!file) return;
            fileInput.style.color = "green"; 

            const url = URL.createObjectURL(file);

            if (file.type.startsWith("image")) {
                image.src = url;
                image.style.display = "block";
                scanButton.style.display = "block";
                scanButton.disabled = false;
                table.style.display = "none";
                statusMessage.textContent = "Image selected. Ready to scan.";
            }
        };

        // Check if there is a captured image in localStorage
        window.addEventListener('DOMContentLoaded', () => {
            const savedImage = localStorage.getItem('capturedImage'); // get from localStorage
            if (savedImage) {
            image.src = savedImage;
            image.style.display = 'block';
            scanButton.style.display = 'block';
            scanButton.disabled = false;
            table.style.display = 'none';
            statusMessage.textContent = "Image captured from camera. Ready to scan.";

            // Clear it from localStorage after loading (optional)
            localStorage.removeItem('capturedImage');
        }
    });


        fileInput.addEventListener("change",fileInputSelect);

        scanButton.addEventListener("click", async () => {
            statusMessage.textContent = "Scanning... Please wait.";
            scanButton.disabled = true;

            const formData = new FormData();

            if (fileInput.files[0]) {
            // If user uploaded a file
            formData.append("image", fileInput.files[0]);
            } else if (image.src) {
            // If image came from camera (data URL)
            const blob = await (await fetch(image.src)).blob();
            formData.append("image", blob, "capture.png");
            } else {
            statusMessage.textContent = "No image to scan!";
            scanButton.disabled = false;
            return;
            }

            try {
                const response = await fetch("/upload", {
                    method: "POST",
                    body: formData
                });
                statusMessage.textContent = "Scan complete.";              

                if (!response.ok) {
                    statusMessage.textContent = "Scan failed.";
                    throw new Error(`Server error: ${response.statusText}`);
                }

                const data = await response.json();
                
                statusMessage.textContent = "Scan complete. Ingredients are sorted by concern level.";
                
                createIngredientTable(data.structured_data);
            } catch (error) {
                statusMessage.textContent = "An error occurred during the scan." + error.message;
            }
            scanButton.disabled = false;
        });

        // Function to create and populate the ingredient table
        const createIngredientTable = (ingredients) => {
            table.style.display = "block";

            if (!Array.isArray(ingredients) || ingredients.length === 0) {
                statusMessage.textContent = "No ingredients found.";
                table.style.display = "none";
                return;
            }

             table.innerHTML = ""; // reset the table each scan

            // Create table header                                                                                                        
            const header = table.createTHead();
            const headerRow = header.insertRow(0);
            const headers = ["Ingredient", "Category", "Classification", "Concerns",];
            headers.forEach((text) => {
                const th = document.createElement("th");
                th.textContent = text;
                headerRow.appendChild(th);
            });

            // Create table body
            const tbody = table.createTBody();
            ingredients.forEach(ingredient => {
                const row = tbody.insertRow();
                row.insertCell(0).textContent = ingredient.ingredient;
                row.insertCell(1).textContent = ingredient.category;
                row.insertCell(2).textContent = ingredient.classification;
                row.insertCell(3).textContent = ingredient.concerns;

            });
            //table.style.display = 'block';
        };

        

        </script>

    </body>
</html>
