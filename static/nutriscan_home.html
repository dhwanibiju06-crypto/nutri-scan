<html>
    <head>
        <link rel="stylesheet" href="/static/styles.css">

        <title>NutriScan</title>
    </head>
    <body>
        <h1>Welcome to NutriScan</h1>

        <h2>"Always making YOUR life easier"</h2>

        <h3>Would you like to upload an image or use your camera?</h3>

        <a href="nutriscan_camerapage.html">
            <button id = "camera">Use Camera</button>
        </a>

        <input type="file" id="fileInput" accept="image/*">
        <br><br>

        <img id="imagePreview" width="400" style="display:none;">
        <br><br>
        <button id="scanButton" style="display:none;">Start Scan</button>
        <!-- pre shows text in a fixed-width font and preserves whitespace or exactly the response from the API -->
        <pre id="results"></pre>

        <p id="statusMessage">hullo</p>

        <script>
        const fileInput = document.getElementById("fileInput");
        const image = document.getElementById("imagePreview");
        const scanButton = document.getElementById('scanButton');
        const statusMessage = document.getElementById("statusMessage");

        const fileInputSelect = () => {
            const file = fileInput.files[0];
            if (!file) return;

            const url = URL.createObjectURL(file);

            if (file.type.startsWith("image")) {
                image.src = url;
                image.style.display = "block";
                scanButton.style.display = "block";
            }
        };

        fileInput.addEventListener("change",fileInputSelect);

        scanButton.addEventListener("click", async () => {
            const results = document.getElementById("results");
            results.textContent = "Scanning... Please wait.";

            const formData = new FormData();
            formData.append("image", fileInput.files[0]);

            try {
                statusMessage.textContent = "Inside try block.";
                const response = await fetch("/upload", {
                    method: "POST",
                    body: formData
                });
                statusMessage.textContent = "Scan complete.";

                if (!response.ok) {
                    statusMessage.textContent = "Scan failed.";
                    throw new Error(`Server error: ${response.statusText}`);
                }

                const data = await response.json();
                results.textContent = JSON.stringify(data, null, 2);
            } catch (error) {
                statusMessage.textContent = "An error occurred during the scan." + error.message;
                results.textContent = `Error: ${error.message}`;
            }
        });
        
        </script>

    </body>
</html>
